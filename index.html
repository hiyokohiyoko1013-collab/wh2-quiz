<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界遺産検定2級 アウトプット問題集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F1; --sheet:#FFFFFF; --ink:#1E3443; --ink2:#55697A; --line:#D5DCD8;
  --red:#BF3328; --redbg:#F8E6E3; --bold:#1E3443; --boldbg:#E3E9EE;
  --nat:#4F7A5E; --cul:#8A6A2E; --ok:#2E7D5B; --okbg:#E1F0E8; --ng:#BF3328; --ngbg:#F8E6E3;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141C22; --sheet:#1C262E; --ink:#E6ECEF; --ink2:#9AABB7; --line:#2E3B45;
  --red:#F07A6E; --redbg:#3A2423; --bold:#E6ECEF; --boldbg:#26343F;
  --nat:#86B896; --cul:#D3AE6A; --ok:#6CC79C; --okbg:#1E3529; --ng:#F07A6E; --ngbg:#3A2423;}}
:root[data-theme="dark"]{
  --paper:#141C22; --sheet:#1C262E; --ink:#E6ECEF; --ink2:#9AABB7; --line:#2E3B45;
  --red:#F07A6E; --redbg:#3A2423; --bold:#E6ECEF; --boldbg:#26343F;
  --nat:#86B896; --cul:#D3AE6A; --ok:#6CC79C; --okbg:#1E3529; --ng:#F07A6E; --ngbg:#3A2423;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}
.hidden{display:none!important}
.r{color:var(--red);font-weight:700}
.b{font-weight:700;background:var(--boldbg);padding:0 .2em;border-radius:3px}
.s{font-weight:700;border-bottom:2px solid var(--ink)}

/* home */
.chap{font-family:var(--serif);font-weight:800;font-size:15px;color:var(--ink2);margin:6px 0 0}
h1{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.3;margin:2px 0 6px;letter-spacing:.02em}
.lead{color:var(--ink2);font-size:14px;margin:0 0 18px}
.passport{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px 14px 12px}
.passport h2{font-size:14px;font-weight:700;margin:0 0 2px;display:flex;justify-content:space-between;align-items:baseline}
.passport h2 span{font-weight:400;color:var(--ink2);font-size:13px}
.passport p{margin:0 0 10px;font-size:12px;color:var(--ink2)}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
.stamp{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.seal{width:64px;height:64px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:800;font-size:11px;line-height:1.2;text-align:center;white-space:pre-line;color:var(--ink2);position:relative}
.stamp .meter{width:48px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.stamp .meter i{display:block;height:100%;background:var(--ink2)}
.stamp.done .seal{border:3px double var(--red);color:var(--red);transform:rotate(-9deg);background:color-mix(in srgb,var(--red) 7%,transparent)}
.stamp.done .meter i{background:var(--red)}
.stamp.pop .seal{animation:thump .5s ease-out}
@keyframes thump{0%{transform:scale(1.6) rotate(-20deg);opacity:0}60%{transform:scale(.92) rotate(-9deg);opacity:1}100%{transform:rotate(-9deg)}}
@media (prefers-reduced-motion:reduce){.stamp.pop .seal{animation:none}}

.sec{margin-top:22px}
.sec h3{font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 8px}
.seg{display:flex;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:8px;font-size:14px;line-height:1.3}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.seg small{display:block;font-size:11px;opacity:.75;font-weight:400}
.starts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.start{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:14px 12px;text-align:left;line-height:1.35}
.start strong{display:block;font-size:17px}
.start span{font-size:12px;color:var(--ink2)}
.start.main{grid-column:1/-1;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.start.main span{color:inherit;opacity:.8}
.start:disabled{opacity:.45;cursor:default}
.tagfilter{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.foot{display:flex;justify-content:space-between;margin-top:26px;font-size:12px;color:var(--ink2)}
.foot button{background:none;border:0;padding:0;text-decoration:underline;color:var(--ink2);font-size:12px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qtop .x{border:0;background:none;font-size:22px;line-height:1;padding:4px 6px;color:var(--ink2)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s}
.count{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.meta{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.tag.r{background:var(--redbg);color:var(--red)}
.tag.b{background:var(--boldbg);color:var(--bold)}
.tag.s{background:transparent;border:1px solid var(--ink);color:var(--ink);border-bottom-width:1px}
.tag.k{background:transparent;border:1px solid var(--line);color:var(--ink2);font-weight:500}
.meta .site{font-size:12px;color:var(--ink2)}
.qtext{font-size:18px;font-weight:500;line-height:1.65;margin:0}
.choices{display:grid;gap:8px;margin-top:16px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.45;display:flex;gap:10px}
.choice .n{color:var(--ink2);font-weight:700;min-width:1em}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.ng{border-color:var(--ng);background:var(--ngbg)}
.choice:disabled{cursor:default}
.reveal{margin-top:16px;width:100%;border:1.5px dashed var(--ink2);background:none;border-radius:10px;padding:16px;font-size:15px;color:var(--ink2)}
.ans{margin-top:16px;padding:14px;border-radius:10px;background:var(--paper);font-size:18px;font-weight:700}
.ans small{display:block;font-size:12px;color:var(--ink2);font-weight:400}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.judge button{border:0;border-radius:10px;padding:14px;font-weight:700;font-size:15px}
.judge .yes{background:var(--okbg);color:var(--ok)}
.judge .no{background:var(--ngbg);color:var(--ng)}
.verdict{font-family:var(--serif);font-weight:800;font-size:20px;margin:16px 0 4px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin-top:12px;font-size:14px}
.exp ul{margin:4px 0 0;padding-left:1.1em}
.exp li{margin:2px 0}
.exp .pg{font-size:12px;color:var(--ink2)}
.next{margin-top:16px;width:100%;border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:15px;font-size:16px;font-weight:700}

/* result */
.score{font-family:var(--serif);font-weight:800;font-size:56px;line-height:1;margin:18px 0 4px}
.score small{font-size:20px;color:var(--ink2)}
.rlist{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.rlist li{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}
.rlist li b{display:block;color:var(--red);margin-top:2px}
.newstamps{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btnrow{display:grid;gap:8px;margin-top:18px}
.ghost{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:14px;font-size:15px;font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-family:var(--serif);font-weight:800;font-size:22px;line-height:1.35;margin:4px 0 2px}
.sheet .en{font-size:12px;color:var(--ink2);margin:0 0 10px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;margin:0 0 12px}
.facts dt{color:var(--ink2)} .facts dd{margin:0}
.kind{font-size:12px;font-weight:700;padding:1px 8px;border-radius:4px;color:#fff}
.kind.自然{background:var(--nat)} .kind.文化{background:var(--cul)}
.kind.負{background:#3d3d3d}
.points{padding-left:1.1em;margin:0;font-size:15px}
.points li{margin:6px 0}
.hide-terms .points .r,.hide-terms .points .b{color:transparent;background:var(--boldbg);border-radius:3px;cursor:pointer}
.hide-terms .points .r.open,.hide-terms .points .b.open{color:inherit}
.hide-terms .points .r.open{color:var(--red)}
.sheetbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.legend{font-size:12px;color:var(--ink2);margin:0 0 10px}

/* chapters */
.overall{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.overall div{font-size:12px;color:var(--ink2)}
.overall b{display:block;font-family:var(--serif);font-size:24px;color:var(--ink);line-height:1.2}
.overall .bar{grid-column:1/-1;margin-top:8px}
.chlist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.chrow{width:100%;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.chrow .no{font-family:var(--serif);font-weight:800;font-size:22px;color:var(--ink2);text-align:center}
.chrow .tt{font-weight:700;font-size:15px;line-height:1.35}
.chrow .tt small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.chrow .pct{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chrow .mini{grid-column:2/-1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.chrow .mini i{display:block;height:100%;background:var(--red)}
.chrow:disabled{background:transparent;border-style:dashed;cursor:default}
.chrow:disabled .tt{color:var(--ink2);font-weight:500}
.chrow:disabled .pct{font-weight:400;color:var(--ink2);font-size:12px}
.back{border:0;background:none;padding:6px 0;color:var(--ink2);font-size:14px}
.stamps.many{grid-template-columns:repeat(4,1fr)}
.kind.nat{background:var(--nat)} .kind.cul{background:var(--cul)} .kind.neg{background:#3d3d3d} .kind.mix{background:#4f6286} .kind.dan{background:#b0322a}
</style>
</head>
<body>
<main class="wrap">
<section id="home">
  <p class="chap">世界遺産検定2級</p>
  <h1>アウトプット問題集</h1>
  <p class="lead">テキストを1チャプター読んだら、ここで思い出す練習を。</p>
  <div class="overall" id="overall"></div>
  <div class="settings"></div>
  <div class="sec starts">
    <button class="start main" id="hGo5"><strong>全範囲から5問</strong><span>約1分。間違えた問題・未出題を優先</span></button>
    <button class="start" id="hWeak" style="grid-column:1/-1"><strong>苦手だけ復習</strong><span></span></button>
  </div>
  <div class="sec"><h3>チャプター</h3><ul class="chlist" id="chList"></ul></div>
  <div class="foot"><span>記録はこの端末のブラウザに保存されます</span><button id="resetAll">すべての記録をリセット</button></div>
</section>

<section id="chapter" class="hidden">
  <button class="back" id="toHome">← チャプター一覧</button>
  <p class="chap" id="cNo"></p>
  <h1 id="cTitle"></h1>
  <p class="lead" id="cLead"></p>
  <div class="passport">
    <h2 id="cStampHead"></h2>
    <p>その<span class="uw"></span>の問題を全部正解するとスタンプが押されます。タップで要点を確認。</p>
    <div class="stamps" id="stamps"></div>
  </div>
  <div class="settings"></div>
  <div class="sec starts">
    <button class="start main" id="go5"><strong>5問だけ解く</strong><span>約1分。間違えた問題・未出題を優先</span></button>
    <button class="start" id="go10"><strong>10問</strong><span>約3分</span></button>
    <button class="start" id="goAll"><strong>全問</strong><span></span></button>
    <button class="start" id="goWeak" style="grid-column:1/-1"><strong>苦手だけ復習</strong><span></span></button>
  </div>
  <div class="foot"><span id="cStat"></span><button id="resetCh">このチャプターの記録をリセット</button></div>
</section>

<section id="quiz" class="hidden">
  <div class="qtop">
    <button class="x" id="quit" aria-label="やめる">×</button>
    <div class="bar"><i id="barFill"></i></div>
    <span class="count" id="qCount"></span>
  </div>
  <div class="qcard">
    <div class="meta" id="qMeta"></div>
    <p class="qtext" id="qText"></p>
    <div id="qBody"></div>
  </div>
  <div id="qAfter"></div>
</section>

<section id="result" class="hidden">
  <p class="chap">結果</p>
  <div class="score" id="score"></div>
  <p class="lead" id="scoreMsg"></p>
  <div id="newStamps"></div>
  <ul class="rlist" id="missList"></ul>
  <div class="btnrow">
    <button class="next" id="retryMiss">間違えた問題をもう一度</button>
    <button class="ghost" id="backFrom">戻る</button>
  </div>
</section>
</main>

<div class="scrim hidden" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>

CHAPTERS.push({"no": 1, "exclude": [3, 4, 5, 9, 10, 12, 14, 15, 18, 20, 26, 31, 36, 37, 48, 56, 68, 74, 76, 77, 81, 88, 90, 92, 94, 102, 104, 106, 111, 112, 115, 116, 117, 122, 123, 125, 135, 136, 137, 142, 148, 149, 150, 151, 152, 153, 154, 155, 156, 157, 158, 159, 164, 166, 167], "title": "世界遺産の基礎知識", "pages": "p.24–43", "unitWord": "テーマ", "units": [{"id": "jyk", "name": "世界遺産条約と世界遺産", "short": "条約と\n世界遺産", "page": "24", "notes": ["正式名称は「世界の文化遺産及び自然遺産の保護に関する条約」", "1972年、第17回ユネスコ総会で採択", "「[[r:顕著な普遍的価値]]（Outstanding Universal Value＝OUV）」をもつものを「[[b:世界遺産リスト]]」に記載", "1978年に最初の12件。2025年3月時点で1,223件（文化952・自然231・複合40）", "8章・全38条。危機遺産リストの作成、[[r:世界遺産委員会]]や[[b:世界遺産基金]]の設立などを規定", "[[b:世界遺産を保護・保全する義務や責任はまず保有国にある]]。締約国は国際社会全体の義務として協力", "締約国による[[b:教育・広報活動の重要性]]も明記"]}, {"id": "unesco", "name": "ユネスコ", "short": "ユネスコ", "page": "25", "notes": ["国際連合教育科学文化機関。本部はパリにある国連の専門機関", "1945年11月、40ヵ国以上がロンドンに集まり設立に合意（国際連合発足の翌月）", "同月16日に「[[b:国際連合教育科学文化機関憲章（ユネスコ憲章）]]」採択 → 1946年に20ヵ国が批准し、11月4日に発効", "憲章前文「戦争は人の心の中に生まれるものだから、人の心の中にこそ、平和のとりでを築かなければならない」", "ユネスコのマークにはアテネのパルテノン神殿が使われている"]}, {"id": "hist", "name": "世界遺産誕生までの流れ", "short": "誕生まで\nの流れ", "page": "25–27", "notes": ["世界遺産条約の大きな特徴は[[b:文化遺産と自然遺産をひとつの条約の下で保護]]していること", "1931年、アテネの第1回「歴史的記念建造物に関する建築家・技術者国際会議」で[[b:アテネ憲章]]採択。修復に近代的な技術や材料の使用を認めた点が世界遺産条約と異なる", "1954年、ユネスコがオランダのハーグで[[b:武力紛争の際の文化財の保護に関する条約（ハーグ条約）]]を採択", "1964年、ヴェネツィアの第2回会議で[[r:ヴェネツィア憲章]]採択。建設当時の工法や素材を尊重する「[[r:真正性]]」の概念", "1965年、ヴェネツィア憲章の考え方に基づき[[b:ICOMOS]]設立", "1872年、アメリカで世界最初の国立公園[[b:イエローストーン国立公園]]。「ウィルダネス」の考え方は世界遺産にも継承", "1948年、ユネスコ主導で[[b:IUCN]]設立", "1972年、スウェーデンのストックホルムで国連人間環境会議 → 同年11月のユネスコ総会で世界遺産条約採択", "年表：1959 ICCROM設立／1960 ヌビア救済開始／1992 日本が締結・世界遺産センター設立・文化的景観採択／1994 グローバル・ストラテジー採択"]}, {"id": "nubia", "name": "ヌビアの遺跡群救済キャンペーン", "short": "ヌビア\n救済", "page": "27–28", "notes": ["エジプトのナイル川沿い、アブ・シンベル神殿からフィラエまでの[[b:ヌビア地方にある遺跡群]]", "1952年、エジプト政府がアスワン・ハイ・ダム建設計画を策定。ナセル大統領が実行 → 遺跡群が水没の危機", "ユネスコは[[b:経済開発と遺産保護の両立]]に取り組み、1960年にキャンペーン開始、1964年に本格的な募金活動", "約50ヵ国の国々や民間団体、個人が協力 →「人類共通の遺産」という理念が生まれた const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(stats))}catch(e){}};
save();
CHAPTERS.sort((a,b)=>a.no-b.no);
const Q=[];
CHAPTERS.forEach(c=>c.qs.forEach((q,i)=>{if(c.onlyTags&&!c.onlyTags.includes(q[1]))return;if(c.exclude&&c.exclude.includes(i))return;Q.push({id:"c"+c.no+"-"+i,ch:c.no,unit:q[0],tag:q[1],text:q[2],ans:q[3],dis:q[4]})}));
const chOf=no=>CHAPTERS.find(c=>c.no===no);
const unitOf=(no,uid)=>{const c=chOf(no);return c&&c.units.find(u=>u.id===uid)};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mark=s=>esc(s).replace(/\[\[([rbs]):(.+?)\]\]/g,'<span class="$1">$2</span>');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pad=n=>String(n).padStart(2,"0");

let mode="choice", tagF="all", curCh=null, origin="home";
let session=[], idx=0, results=[], doneBefore=new Set();

const isOk=q=>stats[q.id]&&stats[q.id].last===1;
const isWeak=q=>stats[q.id]&&stats[q.id].last===0;
function unitProgress(no,uid){const qs=Q.filter(q=>q.ch===no&&q.unit===uid);const ok=qs.filter(isOk).length;return{ok,n:qs.length,done:qs.length>0&&ok===qs.length}}
function doneUnits(){const s=new Set();CHAPTERS.forEach(c=>c.units.forEach(u=>{if(unitProgress(c.no,u.id).done)s.add(c.no+":"+u.id)}));return s}
const inTag=q=>tagF==="all"||q.tag===tagF;
const scopeQs=no=>Q.filter(q=>(no==null||q.ch===no)&&inTag(q));

function renderSettings(){
  if(tagF!=="all"&&!Q.some(q=>q.tag===tagF&&(curCh==null||q.ch===curCh)))tagF="all";
  document.querySelectorAll(".settings").forEach(el=>{
    el.innerHTML=`<div class="sec"><h3>解き方</h3><div class="seg">
      <button data-mode="choice" aria-pressed="${mode==="choice"}">4択<small>サクッと確認</small></button>
      <button data-mode="card" aria-pressed="${mode==="card"}">思い出しカード<small>答えを頭で出す</small></button></div></div>
      <div class="sec"><h3>出題範囲</h3><div class="tagfilter">${[["all","すべて"],["r","赤字"],["b","太字"],["s","遺産名"],["k","基本事項"]].filter(([t])=>t==="all"||Q.some(q=>q.tag===t&&(curCh==null||q.ch===curCh))).map(([t,l])=>`<button class="chip" data-tag="${t}" aria-pressed="${tagF===t}">${l}</button>`).join("")}</div></div>`;
  });
}
document.addEventListener("click",e=>{
  const m=e.target.closest(".settings [data-mode]"); if(m){mode=m.dataset.mode;renderSettings();return}
  const t=e.target.closest(".settings [data-tag]"); if(t){tagF=t.dataset.tag;renderSettings();curCh?renderChapter():renderHome();}
});

function renderHome(){
  curCh=null; renderSettings();
  const all=Q.length, ok=Q.filter(isOk).length, seen=Q.filter(q=>stats[q.id]).length;
  const totalUnits=CHAPTERS.reduce((a,c)=>a+c.units.length,0), du=doneUnits().size;
  $("overall").innerHTML=`<div><b>${ok}<small style="font-size:14px;color:var(--ink2)"> / ${all}問</small></b>クリア（挑戦 ${seen}問）</div><div><b>${du}<small style="font-size:14px;color:var(--ink2)"> / ${totalUnits}</small></b>スタンプ</div><div class="bar"><i style="width:${all?ok/all*100:0}%"></i></div>`;
  const weak=scopeQs(null).filter(isWeak);
  $("hWeak").disabled=!weak.length;
  $("hWeak").querySelector("span").textContent=weak.length?weak.length+"問（全チャプターの直近で間違えた問題）":"いまは苦手な問題なし";
  $("chList").innerHTML=TOC.map(([no,title,pg])=>{
    const c=chOf(no);
    if(!c)return `<li><button class="chrow" disabled><span class="no">${pad(no)}</span><span class="tt">${esc(title)}<small>${pg}〜</small></span><span class="pct">準備中</span></button></li>`;
    const qs=Q.filter(q=>q.ch===no), k=qs.filter(isOk).length;
    return `<li><button class="chrow" data-ch="${no}"><span class="no">${pad(no)}</span><span class="tt">${esc(title)}<small>${c.pages}｜${qs.length}問</small></span><span class="pct">${Math.round(k/qs.length*100)}%</span><span class="mini"><i style="width:${k/qs.length*100}%"></i></span></button></li>`;
  }).join("");
  $("chList").querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>openChapter(+b.dataset.ch));
}
function openChapter(no,pop){curCh=no;renderSettings();show("chapter");renderChapter(pop)}
function renderChapter(pop){
  const c=chOf(curCh);
  $("cNo").textContent="Chapter "+pad(c.no);
  $("cTitle").textContent=c.title;
  const qs=Q.filter(q=>q.ch===c.no);
  $("cLead").textContent=`テキスト ${c.pages}｜${c.units.length}${c.unitWord}・${qs.length}問`;
  document.querySelectorAll(".uw").forEach(x=>x.textContent=c.unitWord);
  const st=$("stamps"); st.innerHTML=""; let d=0;
  c.units.forEach(u=>{
    const p=unitProgress(c.no,u.id); if(p.done)d++;
    const b=document.createElement("button");
    b.className="stamp"+(p.done?" done":"")+(pop&&pop.has(c.no+":"+u.id)?" pop":"");
    b.setAttribute("aria-label",u.name+"（"+p.ok+"/"+p.n+"問正解）");
    b.innerHTML=`<span class="seal">${esc(u.short)}</span><span class="meter"><i style="width:${p.n?p.ok/p.n*100:0}%"></i></span>`;
    b.onclick=()=>openSheet(c.no,u.id);
    st.appendChild(b);
  });
  $("cStampHead").innerHTML=`${c.unitWord}スタンプ帳 <span>${d} / ${c.units.length}</span>`;
  const pool=scopeQs(c.no), weak=pool.filter(isWeak);
  $("goAll").querySelector("span").textContent=pool.length+"問";
  $("goWeak").disabled=!weak.length;
  $("goWeak").querySelector("span").textContent=weak.length?weak.length+"問（直近で間違えた問題）":"いまは苦手な問題なし";
  ["go5","go10","goAll"].forEach(id=>$(id).disabled=!pool.length);
  $("cStat").textContent=`${qs.filter(q=>stats[q.id]).length}問に挑戦・${qs.filter(isOk).length}問クリア`;
}

function pick(n,no){
  const pr=q=>{const s=stats[q.id];return !s?1:(s.last===0?0:2)};
  return shuffle(scopeQs(no)).sort((a,b)=>pr(a)-pr(b)).slice(0,n);
}
function start(list,from){
  if(!list.length)return;
  origin=from||origin;
  session=list.map(q=>({...q,opts:shuffle([q.ans,...q.dis])}));
  idx=0; results=[]; doneBefore=doneUnits();
  show("quiz"); renderQ();
}
function show(id){["home","chapter","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0)}

function renderQ(){
  const q=session[idx], u=unitOf(q.ch,q.unit);
  $("barFill").style.width=(idx/session.length*100)+"%";
  $("qCount").textContent=(idx+1)+" / "+session.length;
  const where=q.tag==="s"&&chOf(q.ch).unitWord==="遺産"?"遺産名を答える問題":(u?esc(u.name)+"（p."+u.page+"）":"チャプター横断");
  $("qMeta").innerHTML=`<span class="tag ${q.tag}">${TAGNAME[q.tag]}</span><span class="site">Ch.${q.ch}｜${where}</span>`;
  $("qText").textContent=q.text;
  $("qAfter").innerHTML="";
  const body=$("qBody"); body.innerHTML="";
  if(mode==="choice"){
    const box=document.createElement("div"); box.className="choices";
    q.opts.forEach((o,i)=>{
      const b=document.createElement("button"); b.className="choice";
      b.innerHTML=`<span class="n">${"ABCD"[i]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{
        const ok=o===q.ans;
        [...box.children].forEach((c,j)=>{c.disabled=true; if(q.opts[j]===q.ans)c.classList.add("ok")});
        if(!ok)b.classList.add("ng");
        answer(ok);
      };
      box.appendChild(b);
    });
    body.appendChild(box);
  }else{
    const r=document.createElement("button"); r.className="reveal";
    r.textContent="答えを思い浮かべたら、タップして確認";
    r.onclick=()=>{
      body.innerHTML=`<div class="ans"><small>答え</small>${esc(q.ans)}</div>
      <div class="judge"><button class="yes">言えた</button><button class="no">出てこなかった</button></div>`;
      body.querySelector(".yes").onclick=()=>answer(true,true);
      body.querySelector(".no").onclick=()=>answer(false,true);
    };
    body.appendChild(r);
  }
}
function unitBlock(no,u){
  const facts=(u.facts||[]).map(f=>f[1]).join("｜");
  return `<div style='margin-top:6px;font-weight:700;font-size:13px'>この${chOf(no).unitWord}の要点</div><ul>${u.notes.map(n=>"<li>"+mark(n)+"</li>").join("")}</ul><div class="pg">${esc(u.name)}${facts?"｜"+esc(facts):""}｜テキスト p.${u.page}</div>`;
}
function answer(ok,card){
  const q=session[idx], st=stats[q.id]||{c:0,w:0};
  ok?st.c++:st.w++; st.last=ok?1:0; stats[q.id]=st; save();
  results.push({q,ok});
  if(card){const j=$("qBody").querySelector(".judge"); if(j)j.remove()}
  const u=unitOf(q.ch,q.unit);
  $("qAfter").innerHTML=`${card?"":`<div class="verdict ${ok?"ok":"ng"}">${ok?"正解":"不正解"}</div>`}
    <div class="exp">${card?"":"<strong>答え：</strong>"+esc(q.ans)}${u?unitBlock(q.ch,u):`<div class="pg">テキスト ${chOf(q.ch).pages} 全体</div>`}</div>
    <button class="next" id="nextBtn">${idx+1<session.length?"次の問題へ":"結果を見る"}</button>`;
  $("nextBtn").onclick=()=>{idx++; idx<session.length?renderQ():finish()};
  $("nextBtn").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"nearest"});
}
function finish(){
  const ok=results.filter(r=>r.ok).length, n=results.length;
  $("score").innerHTML=`${ok}<small> / ${n}</small>`;
  $("scoreMsg").textContent= ok===n?"全問正解。次は別の出題範囲か、思い出しカードで。":ok/n>=.7?"あと少し。間違えた問題だけもう一度解くと定着します。":"テキストの該当ページを読み直してから、もう一度挑戦を。";
  const fresh=[...doneUnits()].filter(x=>!doneBefore.has(x));
  $("newStamps").innerHTML=fresh.length?`<div class="passport"><h2>新しいスタンプ</h2><div class="newstamps">${fresh.map(k=>{const [no,uid]=k.split(":");return `<div class="stamp done pop"><span class="seal">${esc(unitOf(+no,uid).short)}</span></div>`}).join("")}</div></div>`:"";
  const miss=results.filter(r=>!r.ok);
  $("missList").innerHTML=miss.map(r=>`<li>${esc(r.q.text)}<b>${esc(r.q.ans)}</b></li>`).join("");
  $("retryMiss").classList.toggle("hidden",!miss.length);
  $("retryMiss").onclick=()=>start(miss.map(r=>r.q));
  $("backFrom").textContent=origin==="home"?"チャプター一覧に戻る":"スタンプ帳に戻る";
  show("result");
}
function goBack(){
  const pop=new Set([...doneUnits()].filter(x=>!doneBefore.has(x)));
  if(origin==="home"){show("home");renderHome()}else{openChapter(origin,pop)}
}
function openSheet(no,uid){
  const u=unitOf(no,uid), p=unitProgress(no,uid), sh=$("sheet");
  const kinds=(u.kinds||[]).map(k=>`<span class="kind ${k.c}">${esc(k.t)}</span>`).join("");
  const facts=(u.facts||[]).concat([["正解状況",p.ok+" / "+p.n+"問"]]);
  sh.innerHTML=`<div class="meta">${kinds}<span class="site">Ch.${no}｜p.${u.page}</span></div>
   <h2>${esc(u.name)}</h2>${u.en?`<p class="en">${esc(u.en)}</p>`:"<div style='height:8px'></div>"}
   <dl class="facts">${facts.map(f=>`<dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd>`).join("")}</dl>
   <p class="legend"><span class="r">赤字</span>・<span class="b">太字</span>はテキストの強調語。「用語を隠す」で赤シートのように使えます。</p>
   <ul class="points">${u.notes.map(n=>"<li>"+mark(n)+"</li>").join("")}</ul>
   <div class="sheetbtns"><button class="ghost" id="hideBtn">用語を隠す</button><button class="next" style="margin:0" id="unitGo">${u.facts&&u.facts.length===0?"この項目":"この"+chOf(no).unitWord}を解く</button></div>
   <button class="ghost" style="width:100%;margin-top:8px" id="closeSheet">閉じる</button>`;
  $("scrim").classList.remove("hidden");
  const terms=()=>sh.querySelectorAll(".points .r,.points .b,.points .s");
  $("hideBtn").onclick=e=>{const on=sh.classList.toggle("hide-terms");e.target.textContent=on?"用語を表示":"用語を隠す";terms().forEach(x=>x.classList.remove("open"))};
  terms().forEach(x=>x.onclick=()=>x.classList.toggle("open"));
  $("unitGo").onclick=()=>{closeSheet();start(shuffle(Q.filter(q=>q.ch===no&&q.unit===uid)),no)};
  $("closeSheet").onclick=closeSheet;
  $("closeSheet").focus();
}
function closeSheet(){$("scrim").classList.add("hidden");$("sheet").classList.remove("hide-terms")}
$("scrim").onclick=e=>{if(e.target.id==="scrim")closeSheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

$("hGo5").onclick=()=>start(pick(5,null),"home");
$("hWeak").onclick=()=>start(shuffle(scopeQs(null).filter(isWeak)),"home");
$("go5").onclick=()=>start(pick(5,curCh),curCh);
$("go10").onclick=()=>start(pick(10,curCh),curCh);
$("goAll").onclick=()=>start(shuffle(scopeQs(curCh)),curCh);
$("goWeak").onclick=()=>start(shuffle(scopeQs(curCh).filter(isWeak)),curCh);
$("toHome").onclick=()=>{show("home");renderHome()};
$("quit").onclick=()=>{if(origin==="home"){show("home");renderHome()}else openChapter(origin)};
$("backFrom").onclick=goBack;
$("resetAll").onclick=()=>{if(confirm("すべてのチャプターの正解記録とスタンプを消しますか？")){stats={};save();renderHome()}};
$("resetCh").onclick=()=>{if(confirm("このチャプターの正解記録とスタンプを消しますか？")){Q.filter(q=>q.ch===curCh).forEach(q=>delete stats[q.id]);save();renderChapter()}};
renderSettings(); renderHome();
</script>
</body>
</html>
